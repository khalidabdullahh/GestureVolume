name: Build & Publish APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build-apk.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using production release keystore."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK will be signed with a temporary debug key and cannot update an installed production build."
          fi

      - name: Unit tests and release build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist downloads docs/downloads
          cp "$SRC" "dist/GestureVolume-v${VERSION}.apk"
          cp "$SRC" downloads/GestureVolume-latest.apk
          cp "$SRC" docs/downloads/GestureVolume-latest.apk
          cp "$SRC" "downloads/GestureVolume-v${VERSION}.apk"
          cp "$SRC" "docs/downloads/GestureVolume-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: GestureVolume-v${{ steps.apk.outputs.version }}
          path: dist/*.apk

      - name: Publish APK to website (commit to main)
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads docs/downloads
          git diff --cached --quiet && exit 0
          git commit -m "ci: publish APK v${{ steps.apk.outputs.version }} to website"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
